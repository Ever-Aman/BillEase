name: billease_mobile
description: "Offline billing, deliveries and customer ledgers for BillEase."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  drift: ^2.35.3
  sqlite3: ^3.8.0
  flutter_secure_storage: ^11.2.0
  cryptography: ^2.9.0
  http: ^1.6.0
  uuid: ^4.6.0
  path: ^1.9.1
  path_provider: ^2.1.6
  intl: ^0.20.3
  local_auth: ^3.0.2
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  share_plus: ^13.3.1
  cupertino_icons: ^2.0.0
  file_picker: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
